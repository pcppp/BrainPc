includes:
  - base.yaml
model:
  model_name: GDGMTvGIN
  calib_gate_init: -1.7
ood:
  ood_param: 0.0
  trade_off: 0.5
  diffusion_trade_off: 0.5
  entropy_trade_off: 0.01
  feature_dropout: 0.5
  temperature: 0.10
  variance_weight: 0.5
  covariance_weight: 0.02
  gate_sparsity_weight: 0.05
  affine_reg_weight: 0.005
  gate_cons_weight: 0.1
  site_adv_weight: 0.1
  extra_param:
    - "bern"
    - 20
    - 0.7
    - 3
  # --- Episodic meta-learning (site-level MLDG-style) ---
  # When use_episodic_meta is True, each training step samples one source
  # site as the held-out meta-test domain and uses the rest as meta-train.
  # Only training-source sites are sampled — never the real OOD test site.
  use_episodic_meta: true
  lambda_meta: 0.5
  meta_test_aux: false
  min_sites_per_episode: 2
  # Steps per epoch in episodic mode = round(meta_steps_mult * len(train_loader)).
  # Pooled meta-train batches are smaller than standard-mode batches; 1.5x
  # default keeps total graph-forwards comparable to standard mode.
  meta_steps_mult: 1.5
  # Step 2: gradient-conflict resolution.
  #   'none'  — sum g_train + lambda * g_test (default; preserves MLDG semantics)
  #   'pcgrad' — when cos(g_train, g_test) < 0, project g_test onto the
  #              orthogonal complement of g_train. NOTE: this is conceptually
  #              opposite to what MLDG wants. PCGrad zeroes meta-test's
  #              ability to push back against source-overfit directions in
  #              g_train — i.e. it lets source ERM \win\ every conflict.
  #              Empirically tested 2026-05-08 on full LOSO and made fold 7
  #              regress by 0.10 BA. Kept as a knob for ablation only.
  grad_align: none
train:
  max_epoch: 35
  lr: 1e-3
  weight_decay: 1e-4
  ball_r: 0.5
  gb_weight: 0.02
  label_smoothing: 0.0
  patience: 8
  ckpt_min_epoch: 1   # let early-peak ckpts (e.g. epoch 2) enter NMS pool
  classifier_dropout: 0.3
  # Staged training thresholds are now expressed as FRACTIONS of max_epoch
  # via Pipeline._stage_epoch() — see basic_pipeline.py for the defaults.
  # Override absolutes here only if you need a custom schedule, e.g.
  #   gate_warmup_epoch: 10
  #   gbcr_warmup_epoch: 22
