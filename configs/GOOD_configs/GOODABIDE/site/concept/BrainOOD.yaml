includes:
  - base.yaml
model:
  model_name: GDGMTvGIN
  calib_gate_init: -1.7
ood:
  ood_param: 0.0
  trade_off: 0.5
  diffusion_trade_off: 0.5
  entropy_trade_off: 0.01
  feature_dropout: 0.5
  temperature: 0.10
  variance_weight: 0.5
  covariance_weight: 0.02
  gate_sparsity_weight: 0.05
  affine_reg_weight: 0.005
  gate_cons_weight: 0.1
  site_adv_weight: 0.1
  extra_param:
    - "bern"
    - 20
    - 0.7
    - 3
train:
  max_epoch: 35
  lr: 1e-3
  weight_decay: 1e-3
  ball_r: 0.5
  gb_weight: 0.02
  label_smoothing: 0.05
  patience: 8
  classifier_dropout: 0.5
  # Staged training: epoch thresholds
  gate_warmup_epoch: 10
  contrastive_warmup_epoch: 20
